name: ci

# Lint, types and tests on the real corpus; the container built and run; keyless login proven.
# Deploys are in deploy.yml (main only). The help gate arrives with build step 6.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra-lint:
    name: Lint infra scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck infra/*.sh
      - name: Dry run against a stub gcloud (every step must execute, none may hang)
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/gcloud" <<'EOF'
          #!/usr/bin/env bash
          case "$*" in
            "auth list"*) echo ci@example.com ;;
            "projects describe"*) echo 123456789012 ;;
            "billing projects describe"*) echo billingAccounts/0000-AAAA-1111 ;;
            "billing accounts describe"*) echo SGD ;;
            *"quotas info describe"*) echo MiBy ;;
            *describe*) [ "$CLOUDSDK_CORE_DISABLE_PROMPTS" = 1 ] || read -r _; exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/stub/gcloud"
          # stdin stays open (like a terminal) so a stray prompt would block;
          # process substitution, not a pipe, so the shell doesn't wait for sleep.
          PATH="$RUNNER_TEMP/stub:$PATH" PROJECT=ci-proj DRY_RUN=1 \
            timeout 60 ./infra/setup.sh < <(sleep 600) > dry-run.txt 2>&1
          grep -q '== Done' dry-run.txt
          grep -q 'budget-amount=6.40SGD' dry-run.txt
      - name: deploy.sh against the stub (never public, never always-on)
        run: |
          printf '#!/usr/bin/env bash\necho "gcloud $*" >> "$RUNNER_TEMP/calls.txt"\n' > "$RUNNER_TEMP/stub/gcloud"
          PATH="$RUNNER_TEMP/stub:$PATH" PROJECT=p REGION=us-central1 RUNTIME_SA=sa@p.iam.gserviceaccount.com \
            BUCKET=b IMAGE=img ALLOWED_EMAILS=a@example.com,b@example.com timeout 30 ./infra/deploy.sh
          cat "$RUNNER_TEMP/calls.txt"
          grep -q -- '--min-instances=0 --max-instances=1 --cpu-throttling' "$RUNNER_TEMP/calls.txt"
          grep -q -- '--tasks=1 --parallelism=1 --max-retries=0' "$RUNNER_TEMP/calls.txt"
          ! grep -q -- 'allow-unauthenticated\|allUsers' "$RUNNER_TEMP/calls.txt"
          grep -q -- '|MANIFEST_ALLOWED_EMAILS=a@example.com,b@example.com|' "$RUNNER_TEMP/calls.txt"

  engine:
    name: Engine (lint, types, tests on the real corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the corpus, pinned to a fixed commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: DITA-OT 4.4 (cached)
        id: dita-cache
        uses: actions/cache@v4
        with:
          path: ~/dita-ot-4.4
          key: dita-ot-4.4
      - if: steps.dita-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/dita.zip https://github.com/dita-ot/dita-ot/releases/download/4.4/dita-ot-4.4.zip
          unzip -q /tmp/dita.zip -d ~
      - run: echo "DITA_HOME=$HOME/dita-ot-4.4" >> "$GITHUB_ENV"
      - name: lychee 0.24.2 (link checker)
        run: |
          curl -sSL -o /tmp/lychee.tgz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p ~/lychee && tar xzf /tmp/lychee.tgz -C ~/lychee
          echo "LYCHEE=$(find ~/lychee -name lychee -type f | head -1)" >> "$GITHUB_ENV"
      - run: pip install -e '.[dev,sphinx,agent,cloud]'
      - run: ruff check .
      - run: ruff format --check manifest api tests
      - run: mypy
      - name: pytest (failures are also listed as annotations on the check)
        run: |
          set +e
          pytest -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest.txt
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.txt | cut -c1-900 | sed 's/^/::error title=pytest::/'
          grep -E '^(/|tests/).*:[0-9]+: ' pytest.txt | head -20 | cut -c1-900 | sed 's/^/::error title=pytest line::/'
          exit "$status"
      - name: Migrate the TPU map end to end, with the approved rules
        run: |
          # Exit 0: every topic passes. 1: some topics need an approved rule or a writer; the test
          # suite asserts exactly which. 2 or more: an error, which fails the job.
          manifest migrate corpus/tpu/tpu.ditamap --out build --rules rules || status=$?
          test "${status:-0}" -le 1
      - uses: actions/upload-artifact@v4
        with:
          name: migration
          path: |
            build/report
            build/myst
            build/inventory.json
            build/convert/ledger.json
            build/check/check.json
            build/check/sphinx-html
            build/links

  wif-smoke:
    name: Keyless login to Google Cloud
    # Same-repo pull requests and pushes only: forks get no OIDC token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for the GitHub OIDC token (google-github-actions/auth README)
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove the deploy SA can see the one repo it may push to
        run: |
          gcloud auth list
          gcloud artifacts repositories describe tw-images \
            --location="${{ vars.GCP_REGION }}" --format='value(name)'

  image:
    name: Container (build, migrate inside it, API health, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: manifest:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The whole toolchain works inside the image
        run: |
          docker run --rm manifest:ci manifest migrate corpus/tpu/tpu.ditamap --out /tmp/build --rules rules \
            || status=$?
          test "${status:-0}" -le 1
      - name: The API starts and answers
        run: |
          docker run -d --name api -p 8080:8080 manifest:ci \
            uvicorn --factory api.main:create_local_app --host 0.0.0.0 --port 8080
          for _ in $(seq 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/config | grep -q '"sign_in":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/runs)" = 503
          docker rm -f api
      - name: Size against the Artifact Registry share (ADR 0008)
        run: |
          bytes=$(docker save manifest:ci | gzip -6 | wc -c)
          mb=$((bytes / 1000000))
          layers=$(docker history --no-trunc --format '{{.Size}} {{.CreatedBy}}' manifest:ci | grep -v '^0B' \
            | cut -c1-90 | sed 's/%/%25/g' | tr '\n' ';')
          echo "::notice title=Image size::${mb} MB compressed. Layers: ${layers}"
          echo "Compressed image: ${mb} MB (Artifact Registry free tier 500 MB per billing account)" >> "$GITHUB_STEP_SUMMARY"
          test "$mb" -le 200
